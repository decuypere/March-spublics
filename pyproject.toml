[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veille-mp"
version = "0.1.0"
description = "Veille quotidienne sur les marches publics d'architecture (Belgique + Europe)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "feedparser>=6.0",
    "Flask>=3.0",
    "python-dateutil>=2.8",
]

[project.scripts]
veille = "veille_mp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veille_mp = ["web/templates/*.html", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
