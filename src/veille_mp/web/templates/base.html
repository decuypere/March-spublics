<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Veille marches publics{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e6e9ee;--muted:#5b6572;--ink:#1b1f24;--accent:#1a56db}
@media (prefers-color-scheme: dark){
  :root{--bg:#14171a;--card:#1c2024;--line:#2c3238;--muted:#9aa4b0;--ink:#e8ebee;--accent:#7aa5ff}
}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--bg);color:var(--ink);line-height:1.45;
     font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;
       display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header nav a{color:var(--muted);text-decoration:none;margin-right:14px}
header nav a:hover{color:var(--accent)}
main{padding:20px;max-width:1500px;margin:0 auto}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:120px}
.card .n{font-size:22px;font-weight:600}
.card .l{color:var(--muted);font-size:12px}
form.filters{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;
             display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);
             border-radius:6px;padding:6px 8px;font-size:13px;min-width:120px}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;
       font-size:13px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);
      border-radius:8px;overflow:hidden}
th{background:var(--bg);text-align:left;padding:9px 10px;font-size:12px;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.t{max-width:460px;font-weight:600}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:4px;
     padding:0 5px;margin:1px 2px 1px 0;font-size:11px;
     font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--muted);font-size:12px}
.late{color:#b42318}
.pill{border-radius:20px;padding:1px 8px;font-size:11px;border:1px solid var(--line)}
.ok{color:#067647}.ko{color:#b42318}
.pager{display:flex;gap:8px;align-items:center;margin-top:14px}
.empty{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:30px;
       text-align:center;color:var(--muted)}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>Veille marches publics &middot; architecture</h1>
  <nav>
    <a href="/">Avis</a>
    <a href="/runs">Executions</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
